# Baidu Qianfan Token Plan provider route for the DeepSeek Harness LLM seam.
# The API key is resolved at request time from, in order: this row's apiKey,
# the QIANFAN_API_KEY environment variable, then refs.QIANFAN_API_KEY in
# $DSH_HOME/.credentials.yaml. Leave apiKey empty to use the stored credential.
#
# The base URL is the Token Plan personal gateway, not the general /v2 endpoint:
# a Token Plan key against /v2 fails with token_plan_person_api_key_not_allowed,
# and a general-purpose key against /v2/tokenplan/personal fails the same way.
- insert:
    - id: llm-qianfan
      name: 'dsh-llm-qianfan'
      config:
        apiKey: ''
        baseURL: 'https://qianfan.baidubce.com/v2/tokenplan/personal'

# Usage readout (0.3.0). Two optional keys, both empty by default:
#
#   cookie          console.bce.baidu.com session Cookie for the quota readout.
#                   Leave it empty to use the stored credential
#                   BAIDU_QIANFAN_COOKIE or the environment variable of the
#                   same name. This is NOT the inference key: Baidu publishes no
#                   key-authenticated quota endpoint, so the API key above
#                   cannot answer the plan's remaining balance.
#   credentialsFile the credentials document to read both from, when it is not
#                   $DSH_HOME/.credentials.yaml.
#
# The feature mounts inside an optional webServer scope, so a headless profile
# keeps the provider route and simply has no card.
